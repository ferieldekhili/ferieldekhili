<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d"><title id="t">Fériel Dekhili</title><desc id="d">AI Engineer intern at Agora Software. I build AI agents and data tools for finance. IT for Finance engineering student at EFREI Paris.</desc><defs><clipPath id="clip"><rect width="1200" height="420" rx="28"/></clipPath><radialGradient id="b1"><stop offset="0" stop-color="#7C3AED" stop-opacity=".95"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient><radialGradient id="b2"><stop offset="0" stop-color="#EC4899" stop-opacity=".75"/><stop offset="1" stop-color="#EC4899" stop-opacity="0"/></radialGradient><radialGradient id="b3"><stop offset="0" stop-color="#F59E0B" stop-opacity=".55"/><stop offset="1" stop-color="#F59E0B" stop-opacity="0"/></radialGradient><radialGradient id="b4"><stop offset="0" stop-color="#14B8A6" stop-opacity=".6"/><stop offset="1" stop-color="#14B8A6" stop-opacity="0"/></radialGradient><linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#2DD4BF"/><stop offset=".4" stop-color="#A78BFA"/><stop offset=".75" stop-color="#F472B6"/><stop offset="1" stop-color="#FBBF24"/></linearGradient><linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F472B6" stop-opacity=".28"/><stop offset="1" stop-color="#F472B6" stop-opacity="0"/></linearGradient></defs><style> text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif; } .drift1 { animation: d1 14s ease-in-out infinite alternate; } .drift2 { animation: d2 17s ease-in-out infinite alternate; } .drift3 { animation: d3 12s ease-in-out infinite alternate; } @keyframes d1 { to { transform: translate(120px, 40px); } } @keyframes d2 { to { transform: translate(-140px, -30px); } } @keyframes d3 { to { transform: translate(60px, -50px); } } .candle { transform-box: fill-box; transform-origin: 50% 100%; animation: grow .55s cubic-bezier(.2,.9,.3,1.2) both; } @keyframes grow { from { transform: scaleY(0); opacity: 0; } to { transform: scaleY(1); opacity: 1; } } .trend { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.6s ease-out 1.5s forwards; } @keyframes draw { to { stroke-dashoffset: 0; } } .areafill { opacity: 0; animation: fade 1s ease-out 2.6s forwards; } .rise { opacity: 0; animation: rise .8s ease-out both; } @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } } .pop { opacity: 0; animation: fade .5s ease-out both; } @keyframes fade { to { opacity: 1; } } .end { opacity: 0; animation: fade .4s ease-out 3s forwards; } .ring { transform-box: fill-box; transform-origin: center; animation: ring 2.2s ease-out 3.1s infinite; opacity: 0; } @keyframes ring { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(3.2); opacity: 0; } } .live { animation: blink 1.8s ease-in-out infinite; } @keyframes blink { 50% { opacity: .25; } } @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .trend { stroke-dashoffset: 0; } .areafill, .end, .pop, .rise { opacity: 1; } } </style><g clip-path="url(#clip)"><rect width="1200" height="420" fill="#120C34"/><circle class="drift1" cx="980" cy="60" r="360" fill="url(#b1)"/><circle class="drift2" cx="1150" cy="420" r="300" fill="url(#b2)"/><circle class="drift3" cx="120" cy="430" r="260" fill="url(#b4)"/><circle class="drift2" cx="560" cy="-40" r="220" fill="url(#b3)"/><rect width="1200" height="420" fill="#120C34" fill-opacity=".18"/><g class="rise" style="animation-delay:.05s"><rect x="64" y="62" width="352" height="36" rx="18" fill="#FFFFFF" fill-opacity=".1" stroke="#FFFFFF" stroke-opacity=".22"/><circle class="live" cx="86" cy="80" r="6" fill="#2DD4BF"/><text x="102" y="86" font-size="16" font-weight="600" fill="#F5F3FF">AI Engineer intern at Agora Software</text></g><text class="rise" style="animation-delay:.2s" x="60" y="182" font-size="78" font-weight="800" letter-spacing="-1.5" fill="#FFFFFF">Fériel Dekhili</text><text class="rise" style="animation-delay:.4s" x="64" y="234" font-size="25" font-weight="500" fill="#E9D5FF">I build AI agents and data tools for finance.</text><text class="rise" style="animation-delay:.55s" x="64" y="270" font-size="18" fill="#C4B5FD">IT for Finance engineering student, EFREI Paris</text><g class="pop" style="animation-delay:0.90s"><rect x="64" y="306" width="158" height="34" rx="17" fill="#A78BFA" fill-opacity="0.14" stroke="#A78BFA" stroke-opacity="0.65"/><text x="143.0" y="328" text-anchor="middle" font-size="15" font-weight="600" fill="#A78BFA">AI agents &amp; RAG</text></g><g class="pop" style="animation-delay:1.02s"><rect x="232" y="306" width="64" height="34" rx="17" fill="#F472B6" fill-opacity="0.14" stroke="#F472B6" stroke-opacity="0.65"/><text x="264.0" y="328" text-anchor="middle" font-size="15" font-weight="600" fill="#F472B6">APIs</text></g><g class="pop" style="animation-delay:1.14s"><rect x="306" y="306" width="118" height="34" rx="17" fill="#2DD4BF" fill-opacity="0.14" stroke="#2DD4BF" stroke-opacity="0.65"/><text x="365.0" y="328" text-anchor="middle" font-size="15" font-weight="600" fill="#2DD4BF">Data &amp; SQL</text></g><g class="pop" style="animation-delay:1.26s"><rect x="434" y="306" width="92" height="34" rx="17" fill="#FBBF24" fill-opacity="0.14" stroke="#FBBF24" stroke-opacity="0.65"/><text x="480.0" y="328" text-anchor="middle" font-size="15" font-weight="600" fill="#FBBF24">Finance</text></g><g class="rise" style="animation-delay:.1s"><rect x="720" y="72" width="444" height="290" rx="22" fill="#FFFFFF" fill-opacity=".06" stroke="#FFFFFF" stroke-opacity=".14"/><g stroke="#FFFFFF" stroke-opacity=".07" stroke-width="1"><line x1="736" y1="110" x2="1148" y2="110"/><line x1="736" y1="152" x2="1148" y2="152"/><line x1="736" y1="194" x2="1148" y2="194"/><line x1="736" y1="236" x2="1148" y2="236"/><line x1="736" y1="278" x2="1148" y2="278"/><line x1="736" y1="320" x2="1148" y2="